server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router necesita devolver index.html para las rutas de la SPA.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # El navegador debe comprobar nuevas versiones del worker y del manifiesto.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Vite genera nombres con hash: estos assets sí admiten caché prolongada.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # No devolver HTML para assets inexistentes ni cachear meses los assets sin hash.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
}
